# Alle Einstellungen stehen in der Datei .env (Vorlage: .env.example)
#   cp .env.example .env && nano .env
#   docker compose up -d --build
services:
  showcommander:
    build: .
    container_name: showcommander
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Berlin}
